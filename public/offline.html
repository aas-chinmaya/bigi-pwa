<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>Offline · InvoiceFlow</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #172033; background: #f6f8fc; font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(100%, 440px); padding: 32px; border: 1px solid #e2e8f0; border-radius: 20px; background: white; box-shadow: 0 16px 40px #17203312; }
      .mark { display: grid; width: 44px; height: 44px; place-items: center; border-radius: 14px; color: white; background: #2563eb; font-weight: 700; }
      h1 { margin: 20px 0 8px; font-size: 24px; }
      p { color: #64748b; }
      a { display: inline-flex; margin-top: 12px; padding: 10px 16px; border-radius: 10px; color: white; background: #2563eb; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">IF</div>
      <h1>You’re offline</h1>
      <p>This page has not been saved on this device yet. Return to your invoice list or reconnect and open this page once to use it offline next time.</p>
      <a href="/invoices">Go to invoices</a>
    </main>
  </body>
</html>
